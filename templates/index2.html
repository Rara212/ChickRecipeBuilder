<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="min-h-screen bg-gray-50">
    <div class="py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-3xl mx-auto">
            <div class="bg-white rounded-xl shadow-xl overflow-hidden">
                <div class="p-6 sm:p-8">
                    <div class="text-center">
                        <h1 class="flex items-center justify-center text-3xl font-bold text-gray-900">
                            <i class="fas fa-utensils text-orange-500 mr-2"></i>
                            Hello!
                        </h1>
                        <p class="mt-2 text-gray-600">
                            Enter your ingredients and let AI create a delicious recipe for you!
                        </p>
                    </div>

                    <form method="POST" class="mt-8 space-y-6">
                        <div>
                            <label for="ingredients" class="block text-sm font-medium text-gray-700">
                                Your Ingredients
                            </label>
                            <div class="mt-1">
                                <input
                                    type="text"
                                    name="ingredients"
                                    id="ingredients"
                                    value="{{ ingredients if ingredients else '' }}"
                                    class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-orange-500 focus:border-orange-500"
                                    placeholder="e.g., chicken, rice, tomatoes, onions"
                                    required
                                >
                            </div>
                        </div>

                        <button
                            type="submit"
                            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-orange-600 hover:bg-orange-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500"
                        >
                            <i class="fas fa-magic mr-2"></i>
                            Generate Recipe
                        </button>
                    </form>

                    {% if recipe %}
                    <div class="mt-8">
                        <h3 class="text-lg font-medium text-gray-900 mb-4">Your Recipe:</h3>
                        <div class="bg-gray-50 rounded-lg p-6">
                            {% for step in recipe.split('|') %}
                                {% if step.strip() %}
                                <p class="mb-3 text-gray-700">{{ step.strip() }}</p>
                                {% endif %}
                            {% endfor %}
                        </div>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
