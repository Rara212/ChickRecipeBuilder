<!DOCTYPE HTML>
<html lang="en">
<head>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <title>AI-Powered Recipe Generator</title>

    <!-- Styles -->
    <style>
    * {
        font-family: 'Source Sans Pro', sans-serif;
        color: #000000;
    }

    body {
        background-color: #eea443;
        height: 100vh;
    }

    #content {
        padding: 50px;
    }

    .image {
        max-height: 250px;
        border: 4px solid #fff;
    }

    .result {
        text-align: center;
        margin-top: 30px;
    }

    .heading {
        text-align: center;
        font-weight: bold;
    }

    .myForm {
        margin-top: 50px;
        text-align: center;
    }

    /* Styling the button */
    button {
        background-color: grey; /* Black background */
        color: black; /* Black text */
        border: none; /* No border */
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        text-align: center;
        width: 100%; /* Full width */
    }

    button:hover {
        background-color: #333; /* Darker black on hover */
        color: white; /* White text on hover */
    }

    /* Styling the input box */
    textarea {
        margin-top: 10px; /* Space between label and textarea */
        width: 80%; /* Set the width */
        padding: 10px; /* Padding inside the textarea */
        font-size: 16px;
        color: black; /* Black text inside textarea */
        background-color: #fff; /* White background */
        border-radius: 5px; /* Rounded corners */
        border: 2px solid #ccc; /* Light border */
        margin-bottom: 20px; /* Space below the textarea */
    }

    textarea:focus {
        outline: none; /* Remove outline on focus */
        border-color: #aaa; /* Change border color on focus */
    }

    #footer {
        padding: 20px;
        background-color: #73679d;
    }

    .recipe {
        margin-top: 20px;
        background-color: white;
        color: black;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
    }

    .heading, h1 {
        color: black;
    }
    </style>
</head>
<body>
    <div id="content">
        <h1 class="heading">Hello lil chicken!</h1>

        <form method="post" class="myForm">
            <label for="ingredients">What do you have in your fridge today? Enter the ingredients here (comma-separated):</label>
            <br></br>
            <textarea name="ingredients" id="ingredients" required>{{ ingredients }}</textarea><br>
            <button type="submit">Generate Recipe</button>
        </form>

        {% if recipe %}
        <div class="recipe">
            <h2>Want to make a recipe from {{ ingredients }} ?</h2>
            <p>{{ recipe }}</p>
        </div>
        {% elif recipe is not none %}
        <p>Please enter ingredients to generate a recipe.</p>
        {% endif %}
    </div>
</body>
<div id="footer" class="fixed-bottom">
        <div class="row">
            <div class="col text-center">
                <p>Made with &#9829; by Rara</p>
            </div>
        </div>
</div>
    <!-- Bootstrap JS Dependencies-->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
</html>
